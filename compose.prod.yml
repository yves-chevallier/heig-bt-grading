# Production — tb.chevallier.io
# Caddy tourne NATIVEMENT sur l'hôte (voir deploy.md) : on ne publie que des
# ports loopback. Démarrage :
#   docker compose -f compose.prod.yml --env-file .env.prod up -d
services:
  web:
    # Image construite par le CI et tirée de GHCR — JAMAIS construite sur la VM
    # (453 Mio / 1 CPU : un build local étrangle heig-classroom, deploy.md §7).
    # Rollback : IMAGE_TAG=<sha du commit> docker compose ... up -d
    image: ghcr.io/yves-chevallier/heig-bt-grading:${IMAGE_TAG:-latest}
    restart: always
    init: true
    env_file: .env.prod
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: https://tb.chevallier.io
      DATABASE_PATH: /app/data/evaluations.sqlite
      BACKUP_DIR: /app/backups
    ports:
      - '127.0.0.1:3001:3000' # Caddy natif -> reverse_proxy localhost:3001
    volumes:
      - evaluations:/app/data
      - ./backups:/app/backups
      - ./secrets:/app/secrets:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  evaluations:
